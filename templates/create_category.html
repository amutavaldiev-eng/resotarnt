{% extends 'base.html' %}

{% block content %}
<div class="form-box">
    <h1>Add Category</h1>

    <form method="POST">
        {% csrf_token %}
        <input type="text" name="name" placeholder="Enter category name" required>
        <button type="submit">Add Category</button>
        <a href="http://192.168.0.74:2000/" class="back-btn">Back</a>
    </form>
</div>
{% endblock %}

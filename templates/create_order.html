{% extends 'base.html' %}

{% block content %}
<div class="form-box order-box">
    <h1>🛒 Create New Order</h1>
    <p class="form-text">Create a new restaurant order</p>
    <form method="POST">
        {% csrf_token %}
        <input type="text" name="username" placeholder="Customer name" required>
        <select name="table" required>
            <option value="">Select Table</option>
            {% for table in tables %}
                <option value="{{table.id}}">
                    Table {{table.table_num}}</option>
            {% endfor %}
        </select>
        <select name="dishes" required>
            <option value="">Select Dish</option>
            {% for dish in dishes %}
                <option value="{{dish.id}}">
                    {{ dish.name }} - {{ dish.price }} Somoni
                </option>
            {% endfor %}
        </select>
        <button type="submit">+ Create Order</button>
        <a href="http://192.168.0.74:2000/" class="back-btn">Back</a>
    </form>
</div>

{% endblock %}

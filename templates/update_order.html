{% extends 'base.html' %}

{% block content %}

<div class="form-box">

    <h1>Update Order</h1>

    <form method="POST">
        {% csrf_token %}

        <input type="text" name="username" value="{{order.username}}">

        <select name="table">
            {% for table in tables %}
                <option value="{{table.id}}">{{table.table_num}}</option>
            {% endfor %}
        </select>

        <select name="dishes">
            {% for dish in dishes %}
                <option value="{{dish.id}}">{{dish.name}}</option>
            {% endfor %}
        </select>

        <button type="submit">Update</button>

        <a href="http://192.168.0.74:2000/orders/" class="back-btn">Back</a>

    </form>

</div>

{% endblock %}
